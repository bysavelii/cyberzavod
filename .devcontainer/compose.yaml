# Dev container and the database next to it. There is no Docker inside the container on purpose:
# Docker-in-Docker requires privileged mode, and that would defeat the isolation.
name: cyberzavod-dev

services:
  dev:
    build:
      context: .
      args:
        TZ: ${TZ:-Europe/Moscow}
    command: sleep infinity
    # Needed only for iptables inside the container.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      DATABASE_URL: postgres://cyberzavod:cyberzavod@db:5432/cyberzavod?sslmode=disable
      API_ADDR: ":8080"
      # GitHub OAuth app client_id for sign-in from the CLI and on the site; empty: sign-in is off.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # Secret of the same app for sign-in on the site; empty: sign-in on the site is off.
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Site address in development: GitHub returns here after sign-in; Origin is checked by it.
      PUBLIC_URL: http://localhost:4321
      # GitHub ids of the site owners (comma-separated) who may delete recordings and block accounts; empty: none.
      ADMIN_GITHUB_IDS: ${ADMIN_GITHUB_IDS:-}
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # No telemetry: fewer domains in the firewall allowlist.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      HISTFILE: /commandhistory/.zsh_history
      # The pnpm store has its own volume. Otherwise pnpm, seeing node_modules on another volume,
      # creates .pnpm-store right in the project folder on the host.
      npm_config_store_dir: /home/node/.local/share/pnpm/store
      # pnpm from packageManager is downloaded without an interactive prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    ports:
      - "127.0.0.1:4321:4321"
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/workspace:cached
      # Git config and hooks are read-only: otherwise the agent could write a command there
      # (core.fsmonitor, a hook), and git status on the host would run it.
      - ../.git/config:/workspace/.git/config:ro
      - ../.git/hooks:/workspace/.git/hooks:ro
      # The container has its own node_modules: Mac and Linux have different binaries (esbuild).
      - node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - core-node-modules:/workspace/packages/core/node_modules
      - storage-node-modules:/workspace/packages/storage/node_modules
      - cli-node-modules:/workspace/packages/cli/node_modules
      - adapter-claude-node-modules:/workspace/adapters/claude/node_modules
      - pnpm-store:/home/node/.local/share/pnpm
      - go-cache:/home/node/go
      # Claude and GitHub sign-in persists across container rebuilds.
      - claude-config:/home/node/.claude
      - gh-config:/home/node/.config/gh
      - history:/commandhistory
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: cyberzavod
      POSTGRES_USER: cyberzavod
      POSTGRES_PASSWORD: cyberzavod
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberzavod -d cyberzavod"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  node-modules:
  web-node-modules:
  core-node-modules:
  storage-node-modules:
  cli-node-modules:
  adapter-claude-node-modules:
  pnpm-store:
  go-cache:
  claude-config:
  gh-config:
  history:
  db-data:
