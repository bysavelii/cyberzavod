# Checks on every push and pull request; on main they are followed by image builds and deploy.
#
# CI calls the same make targets as `make check` locally, so agents and humans
# check the same thing. On top of that CI only installs dependencies strictly by the lock file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/bysavelii/cyberzavod

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check-web

  api:
    runs-on: ubuntu-latest
    # Gallery store is tested on a real Postgres: without TEST_DATABASE_URL its tests are skipped.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cyberzavod
          POSTGRES_PASSWORD: cyberzavod
          POSTGRES_DB: cyberzavod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberzavod" --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cyberzavod:cyberzavod@localhost:5432/cyberzavod_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # Install only: make check-api runs the linter itself, as it does locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - run: make check-api check-docker

  # The real npm package on three OSes and two Nodes: npm pack, archive install and the human's
  # path in a project with a space in its path (packages/cli/scripts/smoke.ts). Node 24 installs
  # dependencies, as the workspace requires; the package is also checked on the oldest Node.
  package:
    name: package (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm smoke

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-scripts

  # The real Codex CLI (the version is pinned in adapters/codex/e2e/codex-version.ts) against a mock
  # model API: no key, network only to npm. Codex starts commands in a bubblewrap sandbox, which
  # Ubuntu 24.04 forbids to unprivileged users until the AppArmor restriction is lifted.
  codex-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make check-codex

  # Images are tagged with the full commit sha: by it a version is deployed and rolled back.
  # Third-party actions with write access to the registry are pinned by commit sha, not by tag.
  images:
    # Without a name GitHub lists all matrix values in it, including the "." of the site context.
    name: images (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, api, scripts, package, codex-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The deploy key on the server can do only one thing: roll out the images of the given sha.
  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read — the job's temporary token pulls private images on the server
    # and dies with the job.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://cyberzavod.com
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # Deploys are queued, but not in commit order: if a newer commit reached main during
      # the build, this one must not be deployed, since it would bring back the old version.
      # An error reading main must fail the job, not look like "there is a newer commit".
      - name: Коммит всё ещё последний в main
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::не удалось узнать последний коммит main: '$head'"
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::в main уже ${head:0:7}, выкатку ${GITHUB_SHA:0:7} пропускаю"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ключ и отпечаток сервера
        if: steps.freshness.outputs.latest == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The token goes on stdin, not in arguments: those are visible in ps and the server logs.
      - name: Выкатка
        if: steps.freshness.outputs.latest == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$REGISTRY_TOKEN" |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes
          -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
          "deploy@$DEPLOY_HOST" "$GITHUB_SHA"
