# Local environment: Postgres and API in Docker, the frontend runs separately via `pnpm dev`.
# Startup order as in production: database ready → migrations applied → API starts.
name: cyberzavod

x-api: &api
  build: ./apps/api
  image: cyberzavod-api:dev
  environment:
    # Password for local development only; on the server secrets live in .env.
    DATABASE_URL: postgres://cyberzavod:cyberzavod@db:5432/cyberzavod?sslmode=disable
    API_ADDR: ":8080"
    # GitHub OAuth app client_id for sign-in from the CLI and on the site; empty: sign-in is off.
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    # Secret of the same app for sign-in on the site; empty: sign-in on the site is off.
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    # Site address in development: GitHub returns to it after sign-in, Origin is checked against it.
    PUBLIC_URL: http://localhost:4321
    # GitHub ids of the site owners (comma-separated) who may delete recordings and block accounts; empty: none.
    ADMIN_GITHUB_IDS: ${ADMIN_GITHUB_IDS:-}

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: cyberzavod
      POSTGRES_USER: cyberzavod
      POSTGRES_PASSWORD: cyberzavod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberzavod -d cyberzavod"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *api
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    command: ["serve"]
    # Longer than the API Shutdown timeout (10 s), so that Docker does not kill the process earlier.
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
